services:
  - type: web
    name: bull-ai-research
    env: node
    plan: free
    buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile && pnpm build
    startCommand: corepack enable pnpm && pnpm start
    envVars:
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "false"
