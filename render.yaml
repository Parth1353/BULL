services:
  - type: web
    name: bull-ai-research
    env: node
    plan: starter
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    disk:
      name: bull-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: STORAGE_ROOT
        value: /var/data
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "false"
