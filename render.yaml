services:
  - type: web
    name: bull-ai-research
    env: node
    plan: free
    buildCommand: npx -y pnpm@9.15.9 install --frozen-lockfile && npx -y pnpm@9.15.9 build
    startCommand: npx -y pnpm@9.15.9 start
    envVars:
      - key: PORT
        value: 3000
      - key: ANTHROPIC_API_KEY
        value: ""
      - key: DEMO_MODE
        value: "true"
